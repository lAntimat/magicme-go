name = "magicme-go-statistics"
main = "worker.mjs"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

[vars]
GO_ORIGIN = "https://go.magicmebook.ru"
SITE_ORIGIN = "https://magicmebook.ru"

[[d1_databases]]
binding = "DB"
database_name = "magicme-go-statistics"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["0 0 * * *"]
